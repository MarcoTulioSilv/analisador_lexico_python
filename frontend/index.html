<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visualizador Léxico de Python</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 16px; }
    #mensagem { font-size: 2em; font-weight: bold; }
    .erro { color: #c00; }
  </style>
</head>
<body>
  <h1>Visualizador Léxico de Python</h1>
  <p>Ferramenta para mostrar como o Python lê um programa, token por token.</p>
  <p id="mensagem">Carregando...</p>

  <script>
    const el = document.getElementById("mensagem");
    fetch("/api/hello")
      .then(resp => {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(dados => { el.textContent = dados.message; })
      .catch(() => {
        el.textContent = "Erro: o backend não respondeu.";
        el.className = "erro";
      });
  </script>
</body>
</html>
